# Local development with a plain PostgreSQL container (no Supabase needed).
#   docker compose up -d db          # database only; then run `npm run dev` on your machine
#   docker compose up --build        # database + app + one-off migration
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: graduation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graduation"]
      interval: 3s
      retries: 20

  migrate:
    build: .
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/seed.mjs"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/graduation
      DATABASE_SSL: disable
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/graduation
      DATABASE_SSL: disable
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      APP_SECRET: local-development-secret-change-me-0123456789
      ALLOW_TEST_SHORTCUTS: "true"
      PAYMENT_MODE: simulate
      EMAIL_PROVIDER: log
      CRON_SECRET: local-cron-secret
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
