name: Graduation system - scheduler

# Calls the app's scheduler endpoint every 5 minutes: email outbox with retry, expired holds, daily jobs.
# Needs repository secrets SITE_URL (e.g. https://graduation.example.com) and CRON_SECRET (same value as in Vercel).
# GitHub may delay scheduled runs by a few minutes; booking correctness never depends on this job.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/tick
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL or CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/tick"
